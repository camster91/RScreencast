# Home page Worker. Deploy from this folder with the Worker's name:
#   npx wrangler deploy --name <hub-worker-name>
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "be5629964da6a37742ab021584b224d8"
workers_dev = false

# Routes are set in the Cloudflare dashboard: a catch-all for the main site
# and its www/app/ai/admin subdomains. More specific routes (/cast*, /clicker*,
# /book) belong to other Workers and win over these.
#
# Settings kept from the dashboard on each deploy:
#   SITE_NAME       name in the heading, tab title and footer
#   SITE_INTRO      line under the heading
#   CANONICAL_HOST  main hostname; its subdomains redirect to it
keep_vars = true

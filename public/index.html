<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShare Room Hub</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --input-bg: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #room-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-card {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #qrcode {
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin: 20px auto;
            display: inline-block;
        }

        .room-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .id-display {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 10px 0;
            font-family: monospace;
            color: var(--primary);
        }

        .url-helper {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: black;
            z-index: 5;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #room-webcam {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 280px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            background: #000;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            object-fit: cover;
        }

        #client-view,
        #manual-join-view {
            display: none;
            padding: 2rem;
            text-align: center;
            height: 100vh;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .input-group {
            margin: 1.5rem 0;
            text-align: left;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Video Window Styles */
        .video-window {
            position: absolute;
            background: var(--card);
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            resize: both;
            min-width: 200px;
            min-height: 150px;
            z-index: 1000;
        }

        .video-window.minimized {
            height: 50px !important;
            resize: none;
        }

        .video-window-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .video-window-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .video-window-controls {
            display: flex;
            gap: 8px;
        }

        .video-window-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .video-window-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .video-window-btn.close:hover {
            background: #ef4444;
        }

        .video-window video {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: cover;
            display: block;
        }

        .video-window.minimized video {
            display: none;
        }

        /* Participants Grid */
        #participants-grid {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 200px);
            gap: 10px;
            max-width: 420px;
            z-index: 100;
        }

        .participant-tile {
            background: var(--card);
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            aspect-ratio: 4/3;
            position: relative;
        }

        .participant-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Control Bar */
        #control-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            padding: 12px 20px;
            border-radius: 99px;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1001;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .control-btn.active {
            background: var(--primary);
        }

        .control-btn.danger {
            background: #ef4444;
        }

        .control-btn.danger:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>

    <!-- ROOM PC MODE -->
    <div id="room-view">
        <div id="room-pc-setup" class="hero-card">
            <div class="room-badge"><i data-lucide="radio"></i> LIVE MEETING ROOM</div>
            <h1>Ready to Share</h1>
            <div id="qrcode"></div>
            <div class="id-display" id="id-display">...</div>
            <div class="url-helper" id="url-helper">Loading connection...</div>
            <button class="btn"
                style="margin-top:1rem; background:transparent; border:1px solid var(--text-dim); font-size: 0.9rem;"
                onclick="location.search='?mode=join'">Manual Join</button>
        </div>

        <div id="media-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="room-webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- MANUAL JOIN -->
    <div id="manual-join-view">
        <div class="hero-card">
            <h2>Enter Room Code</h2>
            <div class="input-group">
                <input type="text" id="manual-input" maxlength="5" placeholder="ABCDE">
            </div>
            <button class="btn" onclick="submitJoin()">Join Room</button>
        </div>
    </div>

    <!-- CLIENT SHARE -->
    <div id="client-view">
        <div class="hero-card">
            <i data-lucide="monitor-up" style="width:64px; height:64px; color:var(--primary); margin-bottom:1rem;"></i>
            <h2>Sharing to Room</h2>
            <p id="target-room-text" style="color:var(--text-dim); margin-bottom:2rem;"></p>
            <button class="btn" id="share-btn" onclick="startSharing()">Start Screen Share</button>
            <div id="status-msg" style="margin-top:2rem; color:var(--text-dim);"></div>
        </div>
    </div>

    <!-- CONTROL BAR (shown during active session) -->
    <div id="control-bar" style="display:none;">
        <button class="control-btn" id="mic-btn" onclick="toggleMic()" title="Toggle Microphone">
            <i data-lucide="mic" style="width:24px; height:24px;"></i>
        </button>
        <button class="control-btn" id="camera-btn" onclick="toggleCamera()" title="Toggle Camera">
            <i data-lucide="video" style="width:24px; height:24px;"></i>
        </button>
        <button class="control-btn" id="screen-btn" onclick="toggleScreenShare()" title="Toggle Screen Share">
            <i data-lucide="monitor" style="width:24px; height:24px;"></i>
        </button>
        <button class="control-btn danger" onclick="leaveRoom()" title="Leave Room">
            <i data-lucide="phone-off" style="width:24px; height:24px;"></i>
        </button>
    </div>

    <!-- PARTICIPANTS GRID (for host view) -->
    <div id="participants-grid"></div>

    <!-- FLOATING VIDEO WINDOWS CONTAINER -->
    <div id="video-windows-container"></div>

    <!-- Conference Module -->
    <script src="conference.js"></script>

    <script>
        lucide.createIcons();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const isJoinMode = params.get('mode') === 'join';

        // Show appropriate view
        if (roomId) {
            // Client joining a room
            showView('room-view');
            document.getElementById('room-pc-setup').style.display = 'none';
            document.getElementById('media-container').style.display = 'block';

            // Initialize conference as client
            QuickShareConference.init(roomId, false).catch(err => {
                console.error('Failed to join room:', err);
                alert('Failed to join room: ' + err.message);
            });
        } else if (isJoinMode) {
            showView('manual-join-view');
        } else {
            // Host creating a room
            showView('room-view');

            // Initialize conference as host
            QuickShareConference.init(null, true).catch(err => {
                console.error('Failed to create room:', err);
                alert('Failed to create room: ' + err.message);
            });
        }

        function showView(id) {
            ['room-view', 'client-view', 'manual-join-view'].forEach(v => {
                const el = document.getElementById(v);
                if (el) el.style.display = 'none';
            });
            const view = document.getElementById(id);
            if (view) view.style.display = 'flex';
        }

        function submitJoin() {
            const val = document.getElementById('manual-input').value.trim().toUpperCase();
            if (!val) {
                alert('Please enter a room code');
                return;
            }
            window.location.search = '?room=' + val;
        }

        // Control functions
        function toggleMic() {
            QuickShareConference.toggleMic();
        }

        function toggleCamera() {
            QuickShareConference.toggleCamera();
        }

        function toggleScreenShare() {
            QuickShareConference.toggleScreenShare();
        }

        function leaveRoom() {
            if (confirm('Are you sure you want to leave the room?')) {
                QuickShareConference.leaveRoom();
            }
        }
    </script>
</body>

</html>

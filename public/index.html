<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShare Room Hub</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --input-bg: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #room-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-card {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #qrcode {
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin: 20px auto;
            display: inline-block;
        }

        .room-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .id-display {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 10px 0;
            font-family: monospace;
            color: var(--primary);
        }

        .url-helper {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: black;
            z-index: 5;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #room-webcam {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 280px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            background: #000;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            object-fit: cover;
        }

        #client-view,
        #manual-join-view {
            display: none;
            padding: 2rem;
            text-align: center;
            height: 100vh;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .input-group {
            margin: 1.5rem 0;
            text-align: left;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Video Window Styles */
        .video-window {
            position: absolute;
            background: var(--card);
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .video-window.minimized {
            height: 48px !important;
            width: 200px !important;
        }

        .video-window-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            height: 48px;
        }

        .video-window-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-window-controls {
            display: flex;
            gap: 4px;
        }

        .video-window-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .video-window-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .video-window-btn.close:hover {
            background: #ef4444;
        }

        .video-window video {
            width: 100%;
            flex: 1;
            background: #000;
            object-fit: cover;
        }

        .video-window.minimized video {
            display: none;
        }

        /* Participants Grid */
        #participants-grid {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
            pointer-events: none;
        }

        .participant-tile {
            background: var(--card);
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .participant-tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .participant-name {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            backdrop-filter: blur(4px);
        }

        /* Control Bar */
        #control-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 100px;
            display: none;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: #ef4444;
        }

        .control-btn.active:hover {
            background: #dc2626;
        }

        .control-btn i {
            width: 22px;
            height: 22px;
        }
    </style>
</head>

<body>

    <!-- ROOM PC MODE -->
    <div id="room-view">
        <div id="room-pc-setup" class="hero-card">
            <div class="room-badge"><i data-lucide="radio"></i> LIVE MEETING ROOM</div>
            <h1>Ready to Share</h1>
            <div id="qrcode"></div>
            <div class="id-display" id="id-display">...</div>
            <div class="url-helper" id="url-helper">Loading connection...</div>
            <button class="btn"
                style="margin-top:1rem; background:transparent; border:1px solid var(--text-dim); font-size: 0.9rem;"
                onclick="location.search='?mode=join'">Manual Join</button>
        </div>

        <div id="media-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="room-webcam" autoplay playsinline muted></video>
        </div>
    </div>

    <!-- MANUAL JOIN -->
    <div id="manual-join-view">
        <div class="hero-card">
            <h2>Enter Room Code</h2>
            <div class="input-group">
                <input type="text" id="manual-input" maxlength="5" placeholder="ABCDE">
            </div>
            <button class="btn" onclick="submitJoin()">Join Room</button>
        </div>
    </div>

    <!-- CLIENT SHARE -->
    <div id="client-view">
        <div class="hero-card">
            <i data-lucide="monitor-up" style="width:64px; height:64px; color:var(--primary); margin-bottom:1rem;"></i>
            <h2>Ready to Share</h2>
            <p id="target-room-text" style="color:var(--text-dim); margin-bottom:2rem;"></p>
            <button class="btn" id="share-btn" onclick="startSharing()">Connect to Room</button>
            <div id="status-msg" style="margin-top:2rem; color:var(--text-dim);"></div>
        </div>
    </div>

    <!-- UI Components for Conferencing -->
    <div id="participants-grid"></div>
    <div id="video-windows-container"></div>

    <div id="control-bar">
        <button class="control-btn" id="mic-btn" onclick="QuickShareConference.toggleMic()" title="Toggle Microphone">
            <i data-lucide="mic"></i>
        </button>
        <button class="control-btn" id="camera-btn" onclick="QuickShareConference.toggleCamera()" title="Toggle Camera">
            <i data-lucide="video"></i>
        </button>
        <button class="control-btn" id="screen-btn" onclick="QuickShareConference.toggleScreenShare()"
            title="Toggle Screen Share">
            <i data-lucide="monitor"></i>
        </button>
        <button class="control-btn" style="background: #ef4444;" onclick="QuickShareConference.leaveRoom()"
            title="Leave Room">
            <i data-lucide="phone-off"></i>
        </button>
    </div>

    <script src="conference.js"></script>

    <script>
        lucide.createIcons();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const isJoinMode = params.get('mode') === 'join';

        if (roomId) {
            showView('client-view');
            document.getElementById('target-room-text').innerText = "Room ID: " + roomId.toUpperCase();
        } else if (isJoinMode) {
            showView('manual-join-view');
        } else {
            showView('room-view');
            QuickShareConference.init(null, true);
        }

        function showView(id) {
            ['room-view', 'client-view', 'manual-join-view'].forEach(v => {
                const el = document.getElementById(v);
                if (el) el.style.display = 'none';
            });
            const target = document.getElementById(id);
            if (target) target.style.display = 'flex';
        }

        function submitJoin() {
            const val = document.getElementById('manual-input').value.trim();
            if (val) window.location.search = '?room=' + val.toUpperCase();
        }

        async function startSharing() {
            try {
                showView('room-view');
                document.getElementById('room-pc-setup').style.display = 'none';
                document.getElementById('media-container').style.display = 'block';
                await QuickShareConference.init(roomId, false);
            } catch (e) {
                alert("Connection failed: " + e.message);
                location.reload();
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShare Room Hub</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --input-bg: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #room-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-card {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #qrcode {
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin: 20px auto;
            display: inline-block;
        }

        .room-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .id-display {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin: 10px 0;
            font-family: monospace;
            color: var(--primary);
        }

        .url-helper {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
        }

        #media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: black;
            z-index: 5;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        #client-view,
        #manual-join-view {
            display: none;
            padding: 2rem;
            text-align: center;
            height: 100vh;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .input-group {
            margin: 1.5rem 0;
            text-align: left;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- ROOM PC MODE -->
    <div id="room-view">
        <div id="room-pc-setup" class="hero-card">
            <div class="room-badge"><i data-lucide="radio"></i> LIVE MEETING ROOM</div>
            <h1>Ready to Share</h1>
            <div id="qrcode"></div>
            <div class="id-display" id="id-display">...</div>
            <div class="url-helper" id="url-helper">Loading connection...</div>
            <button class="btn"
                style="margin-top:1rem; background:transparent; border:1px solid var(--text-dim); font-size: 0.9rem;"
                onclick="location.search='?mode=join'">Manual Join</button>
        </div>

        <div id="media-container">
            <video id="remote-video" autoplay playsinline></video>
        </div>
    </div>

    <!-- MANUAL JOIN -->
    <div id="manual-join-view">
        <div class="hero-card">
            <h2>Enter Room Code</h2>
            <div class="input-group">
                <input type="text" id="manual-input" maxlength="5" placeholder="ABCDE">
            </div>
            <button class="btn" onclick="submitJoin()">Join Room</button>
        </div>
    </div>

    <!-- CLIENT SHARE -->
    <div id="client-view">
        <div class="hero-card">
            <i data-lucide="monitor-up" style="width:64px; height:64px; color:var(--primary); margin-bottom:1rem;"></i>
            <h2>Sharing to Room</h2>
            <p id="target-room-text" style="color:var(--text-dim); margin-bottom:2rem;"></p>
            <button class="btn" id="share-btn" onclick="startSharing()">Start Screen Share</button>
            <div id="status-msg" style="margin-top:2rem; color:var(--text-dim);"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const isJoinMode = params.get('mode') === 'join';

        // Use PeerJS Cloud server (free hosted signaling server)
        // This avoids WebSocket hosting limitations on shared hosting
        console.log('Using PeerJS Cloud server');
        document.getElementById('url-helper').innerHTML = 'Connecting to PeerJS cloud...';

        // Generate a short 5-character room code for easy sharing
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Avoid confusing chars like 0/O, 1/I
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // If joining a room, use random ID. If hosting, use the room code as peer ID
        const isHosting = !roomId && !isJoinMode;
        const myPeerId = isHosting ? generateRoomCode() : undefined;

        const peer = new Peer(myPeerId, {
            debug: 3, // Max debug level
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        });

        // Connection opened successfully
        peer.on('open', (id) => {
            console.log('Connected to PeerJS cloud with ID:', id);
        });

        // Add error handling
        peer.on('error', (err) => {
            console.error('Peer error:', err.type, err);
            const urlHelper = document.getElementById('url-helper');
            const idDisplay = document.getElementById('id-display');
            if (urlHelper) {
                urlHelper.innerHTML = `<span style="color: #ef4444;">Error: ${err.type} - ${err.message || 'Connection failed'}</span>`;
            }
            if (idDisplay) {
                idDisplay.innerText = 'ERROR';
                idDisplay.style.color = '#ef4444';
            }
        });

        peer.on('disconnected', () => {
            console.warn('Peer disconnected, attempting to reconnect...');
            const urlHelper = document.getElementById('url-helper');
            if (urlHelper) {
                urlHelper.innerHTML = '<span style="color: orange;">Reconnecting...</span>';
            }
            peer.reconnect();
        });

        // Connection timeout
        setTimeout(() => {
            if (!peer.open) {
                console.error('Connection timeout - PeerJS cloud not responding');
                const urlHelper = document.getElementById('url-helper');
                const idDisplay = document.getElementById('id-display');
                if (urlHelper) {
                    urlHelper.innerHTML = '<span style="color: #ef4444;">Connection timeout. Please refresh the page.</span>';
                }
                if (idDisplay) {
                    idDisplay.innerText = 'TIMEOUT';
                    idDisplay.style.color = '#ef4444';
                }
            }
        }, 10000);

        if (roomId) {
            showView('client-view');
            document.getElementById('target-room-text').innerText = "Room ID: " + roomId.substring(0, 5).toUpperCase();
        } else if (isJoinMode) {
            showView('manual-join-view');
        } else {
            initHost();
        }

        function showView(id) {
            ['room-view', 'client-view', 'manual-join-view'].forEach(v => document.getElementById(v).style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        function submitJoin() {
            const val = document.getElementById('manual-input').value;
            if (val) window.location.search = '?room=' + val;
        }

        function initHost() {
            peer.on('open', (id) => {
                console.log('Peer opened with ID:', id);
                // ID is already a 5-char room code we generated
                document.getElementById('id-display').innerText = id;
                const joinUrl = window.location.origin + window.location.pathname + '?room=' + id;
                document.getElementById('url-helper').innerHTML = `Go to <strong>${window.location.host}</strong> and enter code`;
                new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 180, height: 180 });
            });

            peer.on('call', call => {
                console.log('=== INCOMING CALL ===');
                console.log('Call from peer:', call.peer);
                console.log('Answering call...');
                call.answer();

                call.on('stream', stream => {
                    console.log('=== STREAM RECEIVED ===');
                    console.log('Stream tracks:', stream.getTracks().map(t => `${t.kind}: ${t.label}`));
                    document.getElementById('room-pc-setup').style.display = 'none';
                    document.getElementById('media-container').style.display = 'block';
                    const video = document.getElementById('remote-video');
                    video.srcObject = stream;
                    video.play().catch(e => console.error('Video play error:', e));
                });

                call.on('error', (err) => {
                    console.error('Call error:', err);
                });

                call.on('close', () => {
                    console.log('Call closed');
                    document.getElementById('room-pc-setup').style.display = 'flex';
                    document.getElementById('media-container').style.display = 'none';
                });

                // Monitor connection state on host side
                call.peerConnection.oniceconnectionstatechange = () => {
                    console.log('HOST ICE state:', call.peerConnection.iceConnectionState);
                };

                call.peerConnection.onconnectionstatechange = () => {
                    console.log('HOST connection state:', call.peerConnection.connectionState);
                };
            });
        }

        async function startSharing() {
            try {
                // Wait for peer to be ready
                if (!peer.open) {
                    document.getElementById('status-msg').innerHTML = 'Connecting to server...';
                    await new Promise((resolve) => peer.on('open', resolve));
                }

                console.log('My peer ID:', peer.id);
                console.log('Requesting screen share...');
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                console.log('Got screen share stream with tracks:', stream.getTracks().map(t => t.kind));
                console.log('Calling room ID:', roomId);

                const call = peer.call(roomId, stream);

                if (!call) {
                    throw new Error('Failed to create call. The room ID may be invalid or the host is offline.');
                }

                console.log('Call object created, waiting for connection...');

                call.on('stream', (remoteStream) => {
                    console.log('Received response stream from host');
                });

                call.on('error', (err) => {
                    console.error('Call error:', err);
                    alert('Call error: ' + err.message);
                });

                call.on('close', () => {
                    console.log('Call closed by host');
                });

                // Check connection state
                call.peerConnection.oniceconnectionstatechange = () => {
                    console.log('ICE connection state:', call.peerConnection.iceConnectionState);
                };

                call.peerConnection.onconnectionstatechange = () => {
                    console.log('Connection state:', call.peerConnection.connectionState);
                    if (call.peerConnection.connectionState === 'connected') {
                        document.getElementById('status-msg').innerHTML = '<b style="color:var(--primary)">LIVE - CONNECTED</b>';
                    }
                };

                console.log('Call initiated, sharing screen...');
                document.getElementById('status-msg').innerHTML = '<b style="color:orange">CONNECTING...</b>';

                stream.getVideoTracks()[0].onended = () => {
                    console.log('Screen share ended');
                    location.reload();
                };
            } catch (e) {
                console.error('Screen share error:', e);
                alert("Error: " + e.message);
            }
        }
    </script>
</body>

</html>

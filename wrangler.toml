name = "quickshare"
main = "worker/index.js"
compatibility_date = "2026-09-01"
account_id = "be5629964da6a37742ab021584b224d8"

# Routes and custom domains are set in the Cloudflare dashboard (Workers ->
# quickshare -> Settings -> Domains & Routes), so no addresses live in this
# repo. Deploys leave them as they are. Use a wildcard route like
# example.com/cast* so /cast?room=CODE (QR links) also matches, and add
# example.com/join* for the short presenter address.
# workers.dev is off: it would bypass the zone's rate-limit rule.
workers_dev = false

# Settings below are kept from the dashboard on each deploy:
#   CANONICAL_URL   main address, e.g. https://example.com/cast/
#   REDIRECT_HOSTS  old hostnames that redirect to CANONICAL_URL (comma-separated)
#   JOIN_ADDRESS    short address shown on the room screen, e.g. example.com/join
keep_vars = true

# Bundle the files in public/ into the Worker as text
rules = [{ type = "Text", globs = ["**/*.html", "**/*.css", "**/public/*.js", "**/public/**/*.js"], fallthrough = false }]

[[durable_objects.bindings]]
name = "SIGNALING"
class_name = "SignalingServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingServer"]

# Secrets (set with `npx wrangler secret put <NAME>`):
#   CLOUDFLARE_TURN_KEY_ID
#   CLOUDFLARE_TURN_API_TOKEN
